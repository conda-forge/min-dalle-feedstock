{% set name = "min-dalle" %}
{% set version = "0.4.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/min-dalle-{{ version }}.tar.gz
  sha256: 36f9b4e37630bf0c4ee8ab5cd838b858882cbd02e0e8c3e8fcffef65ad9662c3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - emoji
    - numpy >=1.21
    - pillow >=7.1
    - python >={{ python_min }}
    - requests >=2.23
    - pytorch >=1.11
    - typing_extensions >=4.1

test:
  imports:
    - min_dalle
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/kuprel/min-dalle
  summary: A fast, minimal port of DALL E Mini with mega weights.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
